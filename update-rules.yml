name: Update CyberDrain Detection Rules

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

jobs:
  update-rules:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Priority IT repository
        uses: actions/checkout@v5

      - name: Download official CyberDrain rules
        run: |
          curl --fail --silent --show-error --location --retry 3 \
            --output upstream-detection-rules.json \
            https://raw.githubusercontent.com/CyberDrain/Check/refs/heads/main/rules/detection-rules.json

      - name: Merge and validate Priority IT rules
        run: python3 priority_rules.py --input upstream-detection-rules.json --output detection-rules.json

      - name: Commit updated rules
        run: |
          git config user.name "Priority IT Rules Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add detection-rules.json
          if git diff --cached --quiet; then
            echo "No change to detection rules."
          else
            git commit -m "Update CyberDrain and Priority IT detection rules"
            git push
          fi
